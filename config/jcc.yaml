# JCC Core control-plane configuration (P1)
# Secrets are NEVER stored here — only env-var NAMES. See config/.env.example.

server:
  host: 127.0.0.1          # localhost-only; run.py also forces 127.0.0.1 at bind
  port: 4778
  cors_origins:            # EXPLICIT allowlist only — never "*"
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:3000
    - http://127.0.0.1:3000

control:
  token_env: JCC_CONTROL_TOKEN   # read at runtime; unset => control locked (401)

state_store:
  db_path: F:/jev/runtime/jcc/jcc.db   # gitignored runtime dir; WAL enabled

jev:
  provider: mock            # mock | disabled | real
  model: jev-1.13.0
  api_key_env: JEV_API_KEY
  base_url: https://api.typesafe.ai
  feature_flags:
    real_provider: false    # real provider stays OFF until explicitly enabled + key present

actuation:
  enabled: false            # P0-P2: actuation OFF (ADR-0004). Refuses ALL side-effects.
  allowed_actions: []       # none permitted in P1

policy:
  version: p1.0.0
  priority: [ESCALATE, PAUSE, VERIFY, STEER, RETRY, FINISH, CONTINUE]
  thresholds:               # ADR-0008 D-24: RETIRED / INERT — superseded by
    escalate_risk: 0.8      #   p3.shadow.thresholds. Kept for config back-compat
    pause_risk: 0.6         #   ONLY; editing these has NO effect.
    verify_risk: 0.4

p3:                         # ADR-0008 P3 shadow supervision (Sentinel + Metric).
  shadow:
    # enabled stays FALSE until packages/supervisor + jcc_core.decision/signing
    # land (sentinel, task #45). Flipping to true activates the run.py wiring.
    enabled: false
    budget:                 # D-34: limits are DERIVED from persisted state.
      assess_calls: 200
      scorer_tokens: 200000
      events: 2000
      directives: 200
      retries: 5
      escalations: 3
      wall_clock_s: 28800
      cost_units: 500
      cost_units_per_hour: 2000
      directives_per_minute: 600
    thresholds:             # D-24: the LIVE per-agent threshold surface.
      enabled: false        #   false => arbitrate defers to provider flags (== policy.decide)
      default: {escalate_risk: 0.8, pause_risk: 0.6, verify_risk: 0.4}
      workbuddy: {}
      claude: {}
      codex: {}
      hermes: {}
    signing:                # D-33: key is env-only, NEVER in this file.
      key_env: JCC_DIRECTIVE_SIGNING_KEY
      required: false       #   true => refuse to record an unsigned shadow directive

agents:
  # P2 REAL probe results (read-only) on this Windows host, 2026.
  # status: CONNECTED | DEGRADED | ADAPTER_DISABLED | UNVERIFIED
  # aep: normalizer maps the agent's native event -> AEP v0.1 (verified by contract tests)
  # actuation stays DISABLED for every agent (P0-P2, ADR-0004).
  capabilities:
    workbuddy:
      aep: true
      verified: true
      status: CONNECTED
      version: "5.5.6"
      config_path: "C:/Users/Administrator/.workbuddy/settings.json"  # effective (CODEBUDDY_CONFIG_DIR)
      hook_schema_kind: codebuddy-hooks
      permission_request_hooked: false   # P2: native GUI permission flow untouched
    claude:
      aep: true
      verified: true
      status: CONNECTED
      version: "2.1.196"
      config_path: "C:/Users/Administrator/.claude/settings.json"
      hook_schema_kind: claude-hooks
      preserves_user_hooks: true         # separate JCC marker
    codex:
      aep: true              # observation via rollout jsonl is verified
      verified: true
      status: DEGRADED       # push (notify) UNVERIFIED + user-owned notify preserved
      config_path: "C:/Users/Administrator/.codex/config.toml"
      hook_schema_kind: codex-native-hooks+notify
      push_verified: false
      app_server_steering: false         # P0-P2: OFF
    hermes:
      aep: true
      verified: true
      status: CONNECTED
      version: "0.4.0"
      config_path: "C:/Users/Administrator/.hermes/config.yaml"
      hook_schema_kind: hermes-hooks
      transport: signed-outbound-hook     # HMAC + timestamp + delivery_id receiver

