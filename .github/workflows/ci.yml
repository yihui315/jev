name: JEV Command Center — Trading Workbench CI

on:
  push:
    branches: ["feat/jev-trading-workbench", "feat/**", "main"]
  pull_request:
    branches: ["main"]

# Concurrency: cancel stale runs on the same ref.
concurrency:
  group: cc3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck · Build · Unit tests (mock)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/command_center_3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/command_center_3d/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Unit tests (mock — offline, authoritative contract)
        run: npx vitest run

  real-data-probe:
    name: Real Binance market-data probe (non-blocking)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ !cancelled() }}
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/command_center_3d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/command_center_3d/package-lock.json
      - name: Install
        run: npm ci
      # Hits the ACTUAL public Binance endpoint and asserts the live schema.
      # Skipped in the default unit pass; enabled here to produce real evidence.
      - name: Live market-data verification (LIVE_MARKET=1)
        env:
          LIVE_MARKET: "1"
        run: npx vitest run src/views/trading/services/marketData.live.test.ts

# NOTE: The real Paper API (account/orders/research/events) HTTP E2E is NOT run
# here yet. It requires the Night Researcher backend to be bootable, which is
# currently blocked by a wrangler binding-name mismatch (DB vs PAPER_DB) and a
# missing PAPER_LEDGER_SECRET — see src/views/trading/CONTRACT_CONFORMANCE.md §9.
# That E2E must be added once the backend team resolves §9 (do NOT fake a pass).
