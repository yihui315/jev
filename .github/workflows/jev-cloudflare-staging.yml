# JEV-V14 audit: re-run after five Actions Secrets were configured; no logic change.
# CI fix: bounded readiness retries for a freshly created Pages deployment.
name: JEV Cloudflare Pages Staging — authenticated real-backend (Paper Trading on D1)
on:
  push:
    branches: [feat/jev-cloudflare-staging]
    paths:
      - 'apps/command_center_3d/**'
      - '.github/workflows/jev-cloudflare-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-jev-staging
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/command_center_3d
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      JEV_PREVIEW_USER: ${{ secrets.JEV_PREVIEW_USER }}
      JEV_PREVIEW_PASSWORD: ${{ secrets.JEV_PREVIEW_PASSWORD }}
      JEV_PAPER_LEDGER_SECRET: ${{ secrets.JEV_PAPER_LEDGER_SECRET }}
      CF_PROJECT: jev-cloud-staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/command_center_3d/package-lock.json
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Verify preview auth + real-backend gateway fail-closed
        run: node cloud/tests/cf-pages-gate.check.mjs
      - name: Market status classifier (STALE / UNAVAILABLE regression)
        run: node cloud/tests/market-freshness.check.mjs
      - name: Build staging (real Paper Trading backend)
        run: npm run build
      - name: Check available Cloudflare deploy authorization (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN JEV_PREVIEW_USER JEV_PREVIEW_PASSWORD JEV_PAPER_LEDGER_SECRET; do
            if [ -z "${!key:-}" ]; then echo "::error::Missing GitHub Actions secret: $key"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if [ "${#JEV_PREVIEW_PASSWORD}" -lt 20 ]; then echo "::error::JEV_PREVIEW_PASSWORD must be >= 20 characters"; exit 1; fi
      - name: Install Wrangler
        run: npm install --no-save --no-audit --no-fund wrangler@4
      - name: Find or create Cloudflare Pages project
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o "$RUNNER_TEMP/cf-project-check.json" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CF_PROJECT")
          if [ "$status" = 404 ]; then
            npx wrangler pages project create "$CF_PROJECT" --production-branch=feat/jev-cloudflare-staging
          elif [ "$status" != 200 ]; then
            echo "::error::Cloudflare project API returned HTTP $status"; exit 1
          fi
      - name: Install encrypted staging credentials at Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$JEV_PREVIEW_USER" | npx wrangler pages secret put JEV_PREVIEW_USER --project-name="$CF_PROJECT"
          printf '%s' "$JEV_PREVIEW_PASSWORD" | npx wrangler pages secret put JEV_PREVIEW_PASSWORD --project-name="$CF_PROJECT"
          printf '%s' "$JEV_PAPER_LEDGER_SECRET" | npx wrangler pages secret put PAPER_LEDGER_SECRET --project-name="$CF_PROJECT"
          printf '%s' 'false' | npx wrangler pages secret put ENABLE_REAL_TRADING --project-name="$CF_PROJECT"
      - name: Upload Pages (production branch = feat/jev-cloudflare-staging)
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages deploy dist --project-name="$CF_PROJECT" --branch=feat/jev-cloudflare-staging 2>&1 | tee "$RUNNER_TEMP/jev-cf-deploy.log"
          URL=$(grep -oE 'https://[A-Za-z0-9.-]+\.pages\.dev' "$RUNNER_TEMP/jev-cf-deploy.log" | tail -1 || true)
          if [ -z "$URL" ]; then echo "::error::Missing Pages deploy URL; not verified"; exit 1; fi
          echo "PREVIEW_URL=$URL" >> "$GITHUB_ENV"
          echo "### JEV protected Pages staging (real backend)" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $URL/trading.html" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: REAL Paper Trading backend on D1; preview-auth protected; real trading disabled (ENABLE_REAL_TRADING=false)." >> "$GITHUB_STEP_SUMMARY"
      - name: "HTTPS smoke: anonymous denied, authenticated UI, real backend live"
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "$PREVIEW_URL/trading.html" || true)
            if [ "$status" = 401 ]; then break; fi
            sleep 3
          done
          test "$status" = 401
          # Cloudflare clean-URLs redirect /trading.html -> /trading (308).
          # -L is required or the assertion below sees an empty redirect body.
          curl --fail --location --silent --show-error --user "$JEV_PREVIEW_USER:$JEV_PREVIEW_PASSWORD" \
            "$PREVIEW_URL/trading" -o "$RUNNER_TEMP/jev-preview.html"
          test -s "$RUNNER_TEMP/jev-preview.html"
          # Two-layer auth: /api/jev/paper/account needs BOTH preview Basic and
          # a valid Paper Session cookie. Basic-only correctly returns 401.
          # A freshly created Pages deployment can serve its auth middleware
          # before the D1 binding / secrets are propagated to the edge. Retry
          # ONLY bounded transient non-expected responses. Every original
          # assertion is kept (and strengthened); persistent failure still fails.
          anon=""
          for i in $(seq 1 20); do
            anon=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --user "$JEV_PREVIEW_USER:$JEV_PREVIEW_PASSWORD" "$PREVIEW_URL/api/jev/paper/account" || true)
            if [ "$anon" = 401 ]; then break; fi
            echo "::warning::preview auth not ready (attempt $i, HTTP $anon); retrying in 3s"
            sleep 3
          done
          test "$anon" = 401
          session_status=""
          for i in $(seq 1 20); do
            session_status=$(curl --silent --show-error \
              -o "$RUNNER_TEMP/jev-session.json" -w '%{http_code}' \
              --user "$JEV_PREVIEW_USER:$JEV_PREVIEW_PASSWORD" \
              -X POST -H 'content-type: application/json' \
              -d '{"account":"ci_smoke","initialCash":"10000"}' \
              -c "$RUNNER_TEMP/jev-cookies.txt" "$PREVIEW_URL/api/jev/paper/session" || true)
            if [ "$session_status" = 200 ]; then break; fi
            echo "::warning::paper/session not ready (attempt $i, HTTP $session_status); retrying in 3s"
            sleep 3
          done
          test "$session_status" = 200
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('ok') is True and d['data'].get('session')=='created'" "$RUNNER_TEMP/jev-session.json"
          status=""
          for i in $(seq 1 10); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --user "$JEV_PREVIEW_USER:$JEV_PREVIEW_PASSWORD" -b "$RUNNER_TEMP/jev-cookies.txt" \
              "$PREVIEW_URL/api/jev/paper/account" || true)
            if [ "$status" = 200 ]; then break; fi
            echo "::warning::paper/account not ready (attempt $i, HTTP $status); retrying in 3s"
            sleep 3
          done
          test "$status" = 200
