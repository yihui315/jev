name: JEV V1.6 — Market Provenance Hardening

# Real gate, not a cosmetic job: both suites must exit 0 or the run fails.
# No secrets, no cloud D1, no live exchange orders. All fixtures are local
# in-memory SQLite shims with injected fetchers (deterministic, offline).
on:
  push:
    branches: ["feature/v16-market-provenance-hardening"]
  pull_request:
    branches: ["release/jcc-v1.3-final"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v16-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v16-regression:
    name: V1.5 baseline (8 groups / 95 assertions) + V1.6 new suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Independent integrity — frozen engine + frozen DDL + old test byte-identity + new columns
        run: |
          # The verifier exits 0 only when ALL checks are PASS (no FAIL, no PENDING).
          # No-arg run == --mode full: the strongest gate. All V1.6 deliverables are
          # committed together on this branch before push, so full cannot hit PENDING.
          python3 scripts/v16_independent_verify.py || {
            echo "::error::independent integrity check failed"; exit 1;
          }

      - name: V1.5 baseline suite (must remain 8/8 PASS, 95 assertions)
        working-directory: apps/equity_collector_v45
        run: |
          node tests/run-all.mjs
          node -e "
          const s=require('./evidence/summary.json');
          if(s.overall!=='PASS'||s.counts.total!==8||s.counts.pass!==8||s.counts.fail!==0){
            console.error('V1.5_BASELINE_NOT_GREEN',JSON.stringify(s.counts));process.exit(1);}
          const n=s.results.reduce((a,r)=>a+(r.checks?r.checks.length:0),0);
          if(n!==95){console.error('V1.5_ASSERTION_COUNT_CHANGED',n);process.exit(1);}
          console.log('V1.5_BASELINE_OK groups=8 assertions='+n);
          "

      - name: V1.6 new suites (field contract / mixing guard / units / migration / negative)
        working-directory: apps/equity_collector_v45
        run: |
          node tests/v16/run-all.mjs
          node -e "
          const p=require('path').resolve('../../reports/evidence/v16/summary.json');
          const s=require(p);
          if(s.overall!=='PASS'||s.counts.fail!==0){
            console.error('V16_SUITE_NOT_GREEN',JSON.stringify(s.counts));process.exit(1);}
          console.log('V16_SUITE_OK '+JSON.stringify(s.counts));
          "

      - name: Track B — AI Mock Contract Tests (offline, deterministic, no cost)
        working-directory: apps/command_center_3d
        run: |
          # Mock contract tests only, per the owner's CI policy: normal PR CI
          # never spends real provider tokens (Real-AI runs live in a separate
          # controlled task). The runner itself proves zero network usage.
          node server/ai/tests/run-all.mjs
          node -e "
          const p=require('path').resolve('../../reports/evidence/v16_ai/v16_ai_contract_tests.json');
          const s=require(p);
          if(s.overall!=='PASS'||s.counts.failed!==0){
            console.error('V16_AI_CONTRACT_NOT_GREEN',JSON.stringify(s.counts));process.exit(1);}
          if(s.environment.network_calls!==0){
            console.error('V16_AI_TESTS_MADE_NETWORK_CALLS',s.environment.network_calls);process.exit(1);}
          console.log('V16_AI_CONTRACT_OK '+JSON.stringify(s.counts)+' network_calls=0');
          "

      - name: Preserve machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v16-provenance-evidence
          path: |
            apps/equity_collector_v45/evidence/summary.json
            apps/equity_collector_v45/evidence/*.json
            reports/evidence/v16/*.json
            reports/evidence/v16_ai/*.json
          if-no-files-found: warn
