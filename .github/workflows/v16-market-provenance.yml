name: JEV V1.6 — Market Provenance Hardening

# Real gate, not a cosmetic job: both suites must exit 0 or the run fails.
# No secrets, no cloud D1, no live exchange orders. All fixtures are local
# in-memory SQLite shims with injected fetchers (deterministic, offline).
on:
  push:
    # Additive only (F-22-C / C14): "feature/jev-**" covers the V2 ops /
    # integration branches (e.g. feature/jev-v2-ops-integration) whose PR base
    # is a v16 branch. The three pre-existing entries stay as they are.
    branches: ["feature/v16-market-provenance-hardening", "feature/v16-p0-gap-closure", "feature/v16-**", "feature/jev-**"]
  pull_request:
    # "feature/v16-**" is ADDED, "release/jcc-v1.3-final" is RETAINED on purpose:
    # the release-target rule is still a live invariant (asserted by Y1 in
    # check-no-fake-live.mjs), dropping it would be a silent gate regression.
    # The addition makes a PR whose base is a v16 branch actually run this gate.
    branches: ["release/jcc-v1.3-final", "feature/v16-**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v16-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v16-regression:
    name: V1.5 baseline (8 groups / 95 assertions) + V1.6 new suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Independent integrity — frozen engine + frozen DDL + old test byte-identity + new columns
        run: |
          # The verifier exits 0 only when ALL checks are PASS (no FAIL, no PENDING).
          # No-arg run == --mode full: the strongest gate. All V1.6 deliverables are
          # committed together on this branch before push, so full cannot hit PENDING.
          python3 scripts/v16_independent_verify.py || {
            echo "::error::independent integrity check failed"; exit 1;
          }

      - name: Reproduce the V1.5 local test environment (engine anchor tree + A1 probe context)
        run: |
          # (a) T5 reads frozen-engine anchor files at absolute Windows paths
          #     (D:/jev-cloud-staging/...). On Linux those resolve CWD-relative to
          #     a literal "D:" directory, so rebuild that tree from THIS repo's
          #     frozen engine files. Byte-identity is already proven by the
          #     verifier (check 3 tree sha) and T5 re-verifies the 4 anchors.
          set -e
          BASE="apps/equity_collector_v45/D:/jev-cloud-staging/apps/command_center_3d/server/engine"
          mkdir -p "$BASE/_lib" "$BASE/migrations"
          cp apps/command_center_3d/server/engine/_lib/decimal.mjs \
             apps/command_center_3d/server/engine/_lib/equity-snapshot.mjs \
             apps/command_center_3d/server/engine/_lib/paper-server.mjs "$BASE/_lib/"
          cp apps/command_center_3d/server/engine/migrations/0005_equity_snapshots.sql "$BASE/migrations/"
          sha256sum "$BASE/_lib/decimal.mjs" "$BASE/_lib/equity-snapshot.mjs" \
                    "$BASE/_lib/paper-server.mjs" "$BASE/migrations/0005_equity_snapshots.sql"
          # (b) T0 asserts the A1 probe context documented in V1.5: the primary
          #     host is unreachable from the probe environment, so live primary
          #     fetch is honestly labeled BLOCKED and left for the OWNER to
          #     verify on the Cloudflare edge. Block api.binance.us for this
          #     job only — a controlled reproduction of that context (same
          #     class as fault injection). All six T0 assertions still run
          #     REAL curl probes; nothing is stubbed or fabricated.
          echo "0.0.0.0 api.binance.us" | sudo tee -a /etc/hosts

      - name: V1.5 baseline suite (must remain 8/8 PASS, 95 assertions)
        working-directory: apps/equity_collector_v45
        run: |
          node tests/run-all.mjs
          node -e "
          const s=require('./evidence/summary.json');
          if(s.overall!=='PASS'||s.counts.total!==8||s.counts.pass!==8||s.counts.fail!==0){
            console.error('V1.5_BASELINE_NOT_GREEN',JSON.stringify(s.counts));process.exit(1);}
          const n=s.results.reduce((a,r)=>a+(r.checks?r.checks.length:0),0);
          if(n!==95){console.error('V1.5_ASSERTION_COUNT_CHANGED',n);process.exit(1);}
          console.log('V1.5_BASELINE_OK groups=8 assertions='+n);
          "

      - name: V1.6 new suites (field contract / mixing guard / units / migration / negative)
        working-directory: apps/equity_collector_v45
        run: |
          # F-26 (same fail-open as Track B, same fix): summary.json is TRACKED
          # IN GIT, so without a precondition a runner that writes nothing can be
          # certified by the copy inherited from the last commit. Delete first so
          # require() fails closed (MODULE_NOT_FOUND) instead.
          rm -f ../../reports/evidence/v16/summary.json
          node tests/v16/run-all.mjs
          node -e "
          const p=require('path').resolve('../../reports/evidence/v16/summary.json');
          const s=require(p);
          if(s.overall!=='PASS'||s.counts.fail!==0){
            console.error('V16_SUITE_NOT_GREEN',JSON.stringify(s.counts));process.exit(1);}
          if(s.counts.total!==8){
            console.error('V16_SUITE_COUNT_CHANGED expected_groups=8',JSON.stringify(s.counts));process.exit(1);}
          // R20: counts.total counts GROUPS, not assertions. The 104 figure that
          // earlier reports leaned on lives here and nowhere in stdout, so freeze
          // it explicitly — otherwise the number everyone quotes is unfrozen.
          if(!s.assertions||s.assertions.total!==104||s.assertions.failed!==0){
            console.error('V16_ASSERTION_COUNT_CHANGED expected_assertions=104',JSON.stringify(s.assertions));process.exit(1);}
          console.log('V16_SUITE_OK '+JSON.stringify(s.counts)+' assertions='+JSON.stringify(s.assertions));
          "

      - name: Track B — AI Mock Contract Tests (offline, deterministic, no cost)
        working-directory: apps/command_center_3d
        run: |
          # Mock contract tests only, per the owner's CI policy: normal PR CI
          # never spends real provider tokens (Real-AI runs live in a separate
          # controlled task). The runner itself proves zero network usage.
          #
          # F-25 (same class as C12/F-22-G, second workflow): overall=PASS and
          # failed=0 alone cannot tell "120 checks passed" from "3 checks passed
          # and the rest were deleted". Freeze the shape so a silently shrinking
          # suite is a hard failure instead of a green step. Bumping a number
          # below is intentional friction: it must happen in the same commit that
          # adds or removes a suite/check.
          # F-26 (fail-closed freshness). The verifier below validates a JSON file
          # that is TRACKED IN GIT, so without a precondition it can certify the
          # copy inherited from the last commit — i.e. a run that never happened.
          # Proven: replace the runner line with a no-op that exits 0 and writes
          # nothing, and the step still prints V16_AI_CONTRACT_OK / exit 0. Delete
          # the evidence first so `require()` fails closed (MODULE_NOT_FOUND) if the
          # runner did not produce fresh evidence in THIS run.
          rm -f ../../reports/evidence/v16_ai/v16_ai_contract_tests.json
          node server/ai/tests/run-all.mjs
          node -e "
          const p=require('path').resolve('../../reports/evidence/v16_ai/v16_ai_contract_tests.json');
          const s=require(p);
          if(s.overall!=='PASS'||s.counts.failed!==0){
            console.error('V16_AI_CONTRACT_NOT_GREEN',JSON.stringify(s.counts));process.exit(1);}
          if(s.environment.network_calls!==0){
            console.error('V16_AI_TESTS_MADE_NETWORK_CALLS',s.environment.network_calls);process.exit(1);}
          if(s.counts.suites!==10||s.counts.checks!==120){
            console.error('V16_AI_CHECK_COUNT_CHANGED expected_suites=10 expected_checks=120',JSON.stringify(s.counts));process.exit(1);}
          console.log('V16_AI_CONTRACT_OK '+JSON.stringify(s.counts)+' network_calls=0');
          "

      - name: Preserve machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v16-provenance-evidence
          path: |
            apps/equity_collector_v45/evidence/summary.json
            apps/equity_collector_v45/evidence/*.json
            reports/evidence/v16/*.json
            reports/evidence/v16_ai/*.json
          if-no-files-found: warn
